<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realms Memory Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:wght@500;700&family=Metamorphous&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
  /* ---------- Theme tokens ---------- */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --font-title: Georgia, 'Times New Roman', serif;
    --font-body: Georgia, 'Times New Roman', serif;
  }
  body, body[data-theme="lotr"] {
    --bg1: #26391d; --bg2: #0b1208;
    --accent: #e6b84a; --accent2: #8fb04a;
    --text: #f3e8c8; --muted: #b9c49a;
    --panel: rgba(24, 36, 18, .8); --panel-edge: #b08a3e;
    --glow: rgba(230, 184, 74, .42);
    --back-a: #7a5528; --back-b: #2e1f0e;
    --front-a: #f7edca; --front-b: #dcc890; --front-text: #2b1d0e;
    --font-title: 'Uncial Antiqua', 'Cinzel', Georgia, serif;
    --font-body: 'Cinzel', Georgia, 'Times New Roman', serif;
  }
  body[data-theme="hp"] {
    --bg1: #231452; --bg2: #07040f;
    --accent: #d9b44a; --accent2: #ae0001;
    --text: #f6edd4; --muted: #b8aad8;
    --panel: rgba(30, 20, 72, .78); --panel-edge: #d9b44a;
    --glow: rgba(217, 180, 74, .5);
    --back-a: #4a2a8c; --back-b: #140a3a;
    --front-a: #f9eecf; --front-b: #e2c88c; --front-text: #2a1608;
    --font-title: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }
  body[data-theme="got"] {
    --bg1: #2e3b46; --bg2: #05080b;
    --accent: #c3cfda; --accent2: #8ecae6;
    --text: #e9eff4; --muted: #8fa1af;
    --panel: rgba(17, 25, 32, .82); --panel-edge: #738594;
    --glow: rgba(142, 202, 230, .42);
    --back-a: #5b6874; --back-b: #181f26;
    --front-a: #eff2f4; --front-b: #c1cad2; --front-text: #10161b;
    --font-title: 'Metamorphous', 'Cinzel', Georgia, serif;
    --font-body: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  }

  /* Victory palettes: the page changes colors for each theme */
  body[data-theme="lotr"].won {
    --bg1: #3f8a35; --bg2: #0f300f;
    --accent: #ffd24a; --accent2: #b7f36a;
    --text: #fffbe0; --muted: #d6efab;
    --panel: rgba(18, 56, 20, .82); --panel-edge: #ffd24a;
    --glow: rgba(255, 210, 74, .6);
    --back-a: #2f7a38; --back-b: #164a1c;
  }
  body[data-theme="hp"].won {
    --bg1: #6c3fa8; --bg2: #1a0a3a;
    --accent: #ffd84a; --accent2: #ff6b9a;
    --text: #fff7dc; --muted: #e1ccff;
    --panel: rgba(70, 36, 130, .82); --panel-edge: #ffd84a;
    --glow: rgba(255, 216, 74, .65);
    --back-a: #7a4bd0; --back-b: #3a1a7a;
  }
  body[data-theme="got"].won {
    --bg1: #6a1410; --bg2: #160408;
    --accent: #ffb347; --accent2: #ff4d2e;
    --text: #fff1de; --muted: #f2bfa6;
    --panel: rgba(58, 14, 12, .84); --panel-edge: #ffb347;
    --glow: rgba(255, 120, 40, .65);
    --back-a: #a02e1c; --back-b: #3a0c0c;
  }

  /* ---------- Base ---------- */
  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 17px;
    background-color: var(--bg2);
    background-image: radial-gradient(ellipse at 50% -10%, var(--bg1), var(--bg2) 72%);
    background-attachment: fixed;
    transition: background-color .8s ease, color .6s ease;
    overflow-x: hidden;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  body[data-theme="hp"]::after {
    background-image:
      radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 30% 70%, #ffe9a8, transparent),
      radial-gradient(2px 2px at 55% 35%, #fff, transparent),
      radial-gradient(1px 1px at 75% 80%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 90% 15%, #ffe9a8, transparent),
      radial-gradient(1px 1px at 45% 92%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 18% 55%, #fff, transparent),
      radial-gradient(1px 1px at 85% 50%, #ffe9a8, transparent);
    animation: twinkle 3.5s ease-in-out infinite alternate;
  }
  body[data-theme="lotr"]::after {
    background:
      radial-gradient(ellipse at 50% 105%, rgba(230, 184, 74, .16), transparent 60%),
      radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, .5));
  }
  body[data-theme="got"]::after {
    background:
      linear-gradient(180deg, rgba(190, 220, 240, .09), transparent 40%),
      radial-gradient(ellipse at 50% 50%, transparent 52%, rgba(0, 0, 0, .6));
  }
  body.won::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(circle at 50% 35%, var(--glow), transparent 62%);
    animation: glowPulse 3s ease-in-out infinite;
  }

  .hidden { display: none !important; }
  .app { position: relative; z-index: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 10px 14px 44px; }

  .topbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 4px; }
  .icon-btn {
    font-family: var(--font-body); font-size: 15px; font-weight: 700;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0, 0, 0, .35);
    transition: transform .15s, box-shadow .15s;
  }
  .icon-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 14px rgba(0, 0, 0, .45), 0 0 12px var(--glow); }

  .head { text-align: center; margin: 6px 0 14px; }
  .title {
    font-family: var(--font-title);
    font-weight: 400;
    font-size: clamp(26px, 7.5vw, 44px);
    line-height: 1.15;
    margin: 0;
    background: linear-gradient(180deg, #ffffff 10%, var(--accent) 90%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 10px var(--glow));
  }
  .subtitle { margin: 6px 0 0; font-size: 14px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 255, 255, .1), 0 0 22px var(--glow);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background-color .8s, border-color .8s, box-shadow .8s;
  }

  .btn {
    font-family: var(--font-body);
    font-weight: 700; font-size: 15px;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--text);
    background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(0, 0, 0, .18)), var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
    box-shadow: 0 5px 12px rgba(0, 0, 0, .4);
    transition: transform .15s, box-shadow .15s, filter .15s;
  }
  .btn:hover { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 8px 18px rgba(0, 0, 0, .45), 0 0 14px var(--glow); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 5px rgba(0, 0, 0, .5); }
  .btn.primary {
    color: #160e02;
    background: linear-gradient(180deg, #fff1b8 0%, var(--accent) 45%, color-mix(in srgb, var(--accent) 60%, #000) 100%);
    border-color: transparent;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .45), 0 0 18px var(--glow);
  }
  .btn.big { font-size: 17px; padding: 14px 30px; width: 100%; }
  .btn:focus-visible, .icon-btn:focus-visible, .card:focus-visible, .choice:focus-visible, .tab:focus-visible, .name-input:focus-visible {
    outline: 3px solid var(--accent2); outline-offset: 3px;
  }

  /* ---------- Setup ---------- */
  .setup-card { padding: 22px 18px 20px; }
  .field-label { display: block; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .name-input {
    width: 100%;
    font-family: var(--font-body); font-size: 21px; font-weight: 700;
    text-align: center;
    color: var(--text);
    background: rgba(0, 0, 0, .35);
    border: 1px solid var(--panel-edge);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 18px;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, .45);
  }
  .name-input::placeholder { color: var(--muted); opacity: .65; font-weight: 500; }
  .choices { display: grid; gap: 10px; margin-bottom: 18px; }
  .theme-choices, .diff-choices { grid-template-columns: repeat(3, 1fr); }
  .choice {
    font-family: var(--font-body);
    color: var(--text);
    background: rgba(0, 0, 0, .28);
    border: 1px solid color-mix(in srgb, var(--panel-edge) 55%, transparent);
    border-radius: 14px;
    padding: 12px 6px;
    cursor: pointer;
    text-align: center;
    transition: transform .15s, box-shadow .2s, border-color .2s, background .2s;
  }
  .choice:hover { transform: translateY(-2px); }
  .choice[aria-pressed="true"] {
    border-color: var(--accent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 28%, transparent), rgba(0, 0, 0, .25));
    box-shadow: 0 0 0 1px var(--accent), 0 0 20px var(--glow);
  }
  .choice .c-icon { display: block; font-size: 30px; line-height: 1.1; margin-bottom: 4px; }
  .choice .c-name { display: block; font-weight: 700; font-size: 15px; line-height: 1.2; }
  .choice .c-desc { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .error { min-height: 20px; margin: -8px 0 10px; text-align: center; font-size: 15px; color: #ff9a7a; }

  /* ---------- Game ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    padding: 12px 8px; margin-bottom: 14px; text-align: center;
  }
  .stat-label { display: block; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
  .stat-value { display: block; font-weight: 700; font-size: clamp(16px, 4.6vw, 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat-value.accent { color: var(--accent); text-shadow: 0 0 12px var(--glow); }
  .bump { animation: bump .35s ease; }

  .board-wrap { padding: 12px; display: flex; justify-content: center; }
  .board {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), 1fr);
    gap: var(--gap, 10px);
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    padding: 0; border: 0; background: none;
    cursor: pointer;
    perspective: 700px;
    -webkit-tap-highlight-color: transparent;
    animation: dealIn .5s ease backwards;
  }
  .card-inner {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transition: transform .65s cubic-bezier(.3, .8, .3, 1);
  }
  .card:not(.flipped):not(.matched):hover .card-inner { transform: translateY(-3px) scale(1.03); }
  .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    border-radius: calc(var(--cell, 80px) * .12);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 4px 10px rgba(0, 0, 0, .45);
    overflow: hidden;
  }
  .back {
    background:
      repeating-linear-gradient(45deg, transparent 0 7px, rgba(255, 255, 255, .045) 7px 8px),
      radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .22), transparent 55%),
      linear-gradient(145deg, var(--back-a), var(--back-b));
    border: 2px solid var(--panel-edge);
    box-shadow: 0 4px 10px rgba(0, 0, 0, .45), inset 0 0 14px rgba(0, 0, 0, .55);
  }
  .back-symbol {
    font-size: calc(var(--cell, 80px) * .42);
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 12px var(--glow), 0 2px 2px rgba(0, 0, 0, .6);
    font-family: Georgia, serif;
  }
  .back-symbol.ring {
    width: calc(var(--cell, 80px) * .46); height: calc(var(--cell, 80px) * .46);
    border-radius: 50%;
    border: max(3px, calc(var(--cell, 80px) * .06)) solid var(--accent);
    box-shadow: 0 0 12px var(--accent), inset 0 0 6px rgba(0, 0, 0, .6);
    text-shadow: none;
  }
  .front {
    transform: rotateY(180deg);
    background:
      radial-gradient(circle at 30% 20%, rgba(255, 255, 255, .55), transparent 60%),
      linear-gradient(160deg, var(--front-a), var(--front-b));
    border: 2px solid var(--panel-edge);
    color: var(--front-text);
    gap: calc(var(--cell, 80px) * .03);
  }
  .char-icon {
    font-size: calc(var(--cell, 80px) * .46);
    line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35));
  }
  .names-hidden .char-icon { font-size: calc(var(--cell, 80px) * .58); }
  .char-name {
    font-family: var(--font-body);
    font-size: min(15px, max(8px, calc(var(--cell, 80px) * .095)));
    font-weight: 700; line-height: 1.05; letter-spacing: .03em; text-transform: uppercase;
    text-align: center; padding: 0 3px; max-width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .names-hidden .char-name { display: none; }
  .card.matched .front {
    border-color: var(--accent);
    box-shadow: 0 0 calc(var(--cell, 80px) * .22) var(--glow), 0 0 0 2px var(--accent), 0 4px 10px rgba(0, 0, 0, .4);
  }
  .card.matched { animation: matchPop .55s ease .45s; }
  .card.wrong .card-inner { animation: shake .45s ease .5s; }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 16px; }

  /* ---------- Overlays ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(4, 3, 8, .72);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    opacity: 0; pointer-events: none;
    transition: opacity .45s ease;
    overflow-y: auto;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 440px;
    margin: auto;
    padding: 26px 20px 22px;
    text-align: center;
    transform: scale(.86) translateY(20px);
    transition: transform .55s cubic-bezier(.2, 1.1, .3, 1);
  }
  .overlay.show .modal { transform: none; }
  .modal h2 {
    font-family: var(--font-title); font-weight: 400;
    font-size: clamp(26px, 7vw, 36px);
    margin: 0 0 6px;
    color: var(--accent);
    text-shadow: 0 0 18px var(--glow);
  }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 17px; line-height: 1.4; }
  .modal .who { color: var(--text); font-weight: 700; }

  .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 6px; }
  .star { font-size: 40px; line-height: 1; color: rgba(255, 255, 255, .18); }
  .star.on {
    color: var(--accent);
    text-shadow: 0 0 16px var(--glow), 0 0 4px var(--accent);
    animation: starPop .6s cubic-bezier(.2, 1.4, .4, 1) backwards;
  }
  .rating-label { font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }

  .win-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 14px; }
  .win-stat { padding: 10px 4px; border: 1px solid color-mix(in srgb, var(--panel-edge) 60%, transparent); border-radius: 12px; background: rgba(0, 0, 0, .3); }
  .win-stat span { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--muted); }
  .win-stat b { display: block; font-size: 26px; color: var(--accent); margin-top: 2px; }
  .notes { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .note {
    padding: 8px 10px; border-radius: 10px; font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 25%, transparent), rgba(0, 0, 0, .2));
    border: 1px solid var(--accent);
    color: var(--text);
  }
  .note.plain { background: rgba(0, 0, 0, .25); border-color: color-mix(in srgb, var(--panel-edge) 50%, transparent); color: var(--muted); font-weight: 500; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .modal-actions .btn { padding: 10px 16px; font-size: 14px; }

  /* High scores */
  .tabs { display: flex; justify-content: center; gap: 6px; margin: 4px 0 14px; }
  .tab {
    font-family: var(--font-body); font-weight: 700; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); background: rgba(0, 0, 0, .3);
    border: 1px solid color-mix(in srgb, var(--panel-edge) 50%, transparent);
    border-radius: 999px; padding: 7px 16px; cursor: pointer;
  }
  .tab[aria-selected="true"] { color: #160e02; background: linear-gradient(180deg, #fff1b8, var(--accent)); border-color: transparent; box-shadow: 0 0 14px var(--glow); }
  .hs-grid { display: grid; gap: 14px; text-align: left; margin-bottom: 16px; }
  .hs-col h3 { margin: 0 0 6px; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); text-align: center; }
  .hs-col ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; }
  .hs-col li {
    display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 10px; border-radius: 10px;
    background: rgba(0, 0, 0, .3);
    border: 1px solid color-mix(in srgb, var(--panel-edge) 35%, transparent);
    font-size: 16px;
  }
  .hs-col li:first-child { border-color: var(--accent); box-shadow: 0 0 12px var(--glow); }
  .hs-rank { font-weight: 700; color: var(--accent); }
  .hs-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hs-val { font-weight: 700; text-align: right; white-space: nowrap; }
  .hs-val small { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
  .hs-empty { text-align: center; color: var(--muted); font-size: 15px; padding: 10px 0; }

  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 40; pointer-events: none; }

  @keyframes dealIn { from { opacity: 0; transform: translateY(14px) scale(.9); } to { opacity: 1; transform: none; } }
  @keyframes bump { 50% { transform: scale(1.3); } }
  @keyframes matchPop { 40% { transform: scale(1.1); } }
  @keyframes shake { 20% { transform: rotateY(180deg) translateX(-5px); } 60% { transform: rotateY(180deg) translateX(5px); } }
  @keyframes glowPulse { 50% { opacity: .45; } }
  @keyframes twinkle { from { opacity: .45; } to { opacity: 1; } }
  @keyframes starPop { from { transform: scale(0) rotate(-120deg); opacity: 0; } to { transform: none; opacity: 1; } }

  @media (min-width: 560px) {
    .hs-grid { grid-template-columns: 1fr 1fr; }
    .modal.wide { max-width: 640px; }
  }
  @media (max-width: 400px) {
    .choice .c-name { font-size: 13px; }
    .choice .c-icon { font-size: 26px; }
    .btn { padding: 10px 16px; font-size: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .card-inner, .modal, .overlay { transition-duration: .01s; }
  }
</style>
</head>
<body data-theme="hp">
<canvas id="fx" aria-hidden="true"></canvas>

<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="scoresBtn" type="button">🏆 High Scores</button>
    <button class="icon-btn" id="soundBtn" type="button" aria-label="Mute sound" aria-pressed="false">🔊</button>
  </div>

  <!-- Setup screen -->
  <section id="setup">
    <header class="head">
      <h1 class="title" id="setupTitle"></h1>
      <p class="subtitle" id="setupSub"></p>
    </header>
    <div class="panel setup-card">
      <label class="field-label" for="nameInput">Your name</label>
      <input class="name-input" id="nameInput" type="text" maxlength="16" placeholder="Enter your name" autocomplete="off">

      <span class="field-label">Choose your world</span>
      <div class="choices theme-choices" id="themeChoices"></div>

      <span class="field-label">Choose difficulty</span>
      <div class="choices diff-choices" id="diffChoices"></div>

      <p class="error" id="nameError" role="alert"></p>
      <button class="btn primary big" id="startBtn" type="button">Begin the Game</button>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game" class="hidden">
    <header class="head">

<script>
(function () {
  'use strict';

  /* ================= DATA ================= */
  const THEMES = {
    hp: {

        ['Scabbers', '🐀'], ['Fluffy', '🐕'], ['Norbert', '🐉'], ['Broomstick', '🧹'], ['Sorting Hat', '🎩'], ['Elder Wand', '🪄'],
        ['The Stone', '💎'], ['Hogwarts', '🏰'], ['Gryffindor', '🦁'], ['Slytherin', '🐍'], ['Hufflepuff', '🦡'], ['Ravenclaw', '🐦'],
        ['Luna', '🌙'], ['Neville', '🌱'], ['Bellatrix', '🗡️'], ['Sirius', '🏍️'], ['Triwizard Cup', '🏆'], ['Dementor', '👻'],

    },
    lotr: {

      title: 'The Fellowship', sub: 'A Middle-earth Memory Game',
      tagline: 'The Ring is destroyed and Middle-earth is safe!',
      backSymbol: '', wave: 'triangle',
      sfx: { match: [587, 880], miss: [185, 139], win: [392, 494, 587, 784, 988, 1175] },
      fx: { colors: ['#ffd24a', '#b7f36a', '#fff3c4', '#e6b84a', '#7fb23c'], glyphs: ['🍃', '🍂', '✨', '💍', '🌿'], mode: 'leaves' },
      chars: [
        ['Gandalf', '🧙'], ['Frodo', '💍'], ['Aragorn', '👑'], ['Legolas', '🏹'], ['Gimli', '🪓'], ['Gollum', '🐟'],
        ['Sauron', '👁️'], ['Samwise', '🍳'], ['Merry', '🍄'], ['Pippin', '🍺'], ['Boromir', '📯'], ['Faramir', '🛡️'],
        ['Éowyn', '🗡️'], ['Théoden', '🐴'], ['Saruman', '🌪️'], ['Elrond', '🧝'], ['Galadriel', '🌟'], ['Arwen', '🌹'],
        ['Bilbo', '📜'], ['Treebeard', '🌳'], ['Shelob', '🕷️'], ['Smaug', '🐲'], ['Balrog', '👹'], ['Nazgûl', '🦇'],
        ['Gwaihir', '🦅'], ['Shadowfax', '🐎'], ['The Shire', '🏡'], ['Mount Doom', '🌋'], ['Sting', '⚔️'], ['Palantír', '🔮'],
        ['Lembas', '🍞'], ['Uruk-hai', '👺']
      ]
    },
    got: {
      label: 'Game of Thrones', icon: '🐉',
      title: 'Game of Cards', sub: 'A Westeros Memory Game',
      tagline: 'The realm is yours. Long may you reign!',
      backSymbol: '♛\uFE0E', wave: 'sawtooth',
      sfx: { match: [330, 495], miss: [147, 110], win: [262, 330, 392, 523, 659, 784] },
      fx: { colors: ['#ff6a1a', '#ffb347', '#ff3b1a', '#e8f4ff', '#8ecae6'], glyphs: ['🔥', '❄️', '🐉', '👑'], mode: 'fireice' },
      chars: [
        ['Jon Snow', '⚔️'], ['Daenerys', '🐉'], ['Tyrion', '🍷'], ['Cersei', '👸'], ['Jaime', '✋'], ['Arya', '🗡️'],
        ['Sansa', '🥀'], ['Bran', '🐦'], ['Ned Stark', '🪓'], ['Robert', '🦌'], ['Joffrey', '👑'], ['Tywin', '💰'],
        ['Hodor', '🚪'], ['The Hound', '🐕'], ['The Mountain', '🏔️'], ['Brienne', '🛡️'], ['Melisandre', '🔥'], ['Night King', '🧊'],
        ['White Walker', '🥶'], ['Drogon', '🐲'], ['Ghost', '🐺'], ['Iron Throne', '🪑'], ['Valyrian Steel', '🔪'], ['The Wall', '🧱'],
        ['Winterfell', '🏰'], ["King's Landing", '🏙️'], ['Wildfire', '🧨'], ['Littlefinger', '🦜'], ['Varys', '🕸️'], ['Samwell', '📚'],
        ['Khal Drogo', '🏇'], ['Greyjoy', '🦑']
      ]
    }
  };

  const LEVELS = {
    easy:   { label: 'Easy',   n: 4, desc: '4×4 · 8 pairs' },
    medium: { label: 'Medium', n: 6, desc: '6×6 · 18 pairs' },
    hard:   { label: 'Hard',   n: 8, desc: '8×8 · 32 pairs' }
  };

  // Thresholds for 5, 4, 3, 2 stars (anything slower or higher is 1 star)
  const RATING = {
    easy:   { moves: [12, 16, 22, 30],    time: [30, 45, 70, 100] },
    medium: { moves: [27, 36, 50, 68],    time: [90, 130, 190, 270] },
    hard:   { moves: [48, 64, 90, 122],   time: [240, 340, 480, 660] }
  };
  const RATING_LABELS = { 5: 'Legendary', 4: 'Excellent', 3: 'Well done', 2: 'Not bad', 1: 'Keep practicing' };

  const MATCH_POINTS = 100, STREAK_BONUS = 25, MISS_PENALTY = 10, TOP_N = 5;

  /* ================= HELPERS ================= */
  const $ = id => document.getElementById(id);
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const memStore = {};
  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v === null ? (memStore[k] ?? null) : v; } catch (e) { return memStore[k] ?? null; } },
    set(k, v) { memStore[k] = v; try { localStorage.setItem(k, v); } catch (e) {} }
  };
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  const fmtTime = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

  /* ================= STATE ================= */
  const state = { theme: 'hp', level: 'easy', name: '' };
  let first = null, second = null, lock = false, playing = false;
  let moves = 0, score = 0, streak = 0, matches = 0, totalPairs = 0;
  let startTime = 0, timerId = null, elapsed = 0;
  let scoreTab = 'easy';

  const board = $('board');

  /* ================= SOUND ================= */
  let audioCtx = null;
  let muted = store.get('realms_muted') === '1';

  function getCtx() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, delay, dur, type, vol) {
    if (muted) return;
    const c = getCtx();
    if (!c) return;
    const t = c.currentTime + delay;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain);
    gain.connect(c.destination);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }
  function playMatch() {
    const t = THEMES[state.theme];
    tone(t.sfx.match[0], 0, 0.18, t.wave, 0.16);
    tone(t.sfx.match[1], 0.1, 0.32, t.wave, 0.16);
  }
  function playMiss() {
    const t = THEMES[state.theme];
    tone(t.sfx.miss[0], 0, 0.22, 'sawtooth', 0.08);
    tone(t.sfx.miss[1], 0.14, 0.34, 'sawtooth', 0.08);
  }
  function playWin() {
    const t = THEMES[state.theme];
    t.sfx.win.forEach((f, i) => tone(f, i * 0.13, 0.4, t.wave, 0.15));
    const last = t.sfx.win.length * 0.13;
    [0, 4, 7].forEach(semi => tone(t.sfx.win[2] * Math.pow(2, semi / 12), last, 1.1, t.wave, 0.1));
  }
  function updateSoundBtn() {
    $('soundBtn').textContent = muted ? '🔇' : '🔊';
    $('soundBtn').setAttribute('aria-pressed', String(muted));
    $('soundBtn').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }

  /* ================= PARTICLES ================= */
  const cvs = $('fx');
  const cx = cvs.getContext('2d');
  let parts = [], raf = null, lastTs = 0, emitUntil = 0, emitAcc = 0;
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    cvs.width = Math.floor(window.innerWidth * dpr);
    cvs.height = Math.floor(window.innerHeight * dpr);
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function addPart(p) {
    parts.push(Object.assign({
      x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 1, life: 2, age: 0, size: 8,
      rot: 0, vr: 0, tilt: 0, vt: 0, sway: 0, swayF: 2, ph: Math.random() * 6.28,
      type: 'rect', color: '#fff', glyph: ''
    }, p));
  }

  function emitOne() {
    const fx = THEMES[state.theme].fx;
    const W = window.innerWidth, H = window.innerHeight;
    const r = Math.random();
    if (fx.mode === 'fireice') {
      if (r < 0.4) { // rising embers
        addPart({ type: 'spark', x: rand(0, W), y: H + 10, vx: rand(-30, 30), vy: rand(-260, -120), g: -10,
          size: rand(3, 8), life: rand(2, 3.4), color: pick(['#ff6a1a', '#ffb347', '#ff3b1a']), sway: 30, swayF: rand(2, 4) });
      } else if (r < 0.75) { // snow
        addPart({ type: Math.random() < 0.35 ? 'glyph' : 'dot', glyph: '❄️', x: rand(0, W), y: -20, vx: rand(-20, 20), vy: rand(60, 140),
          size: Math.random() < 0.35 ? rand(14, 22) : rand(2, 5), life: 6, color: '#e8f4ff', sway: 30, swayF: rand(1, 3), vr: rand(-1, 1) });
      } else { // confetti in fire colors
        addPart({ type: 'rect', x: rand(0, W), y: -20, vx: rand(-60, 60), vy: rand(120, 260), g: 120,
          size: rand(7, 12), life: 6, color: pick(fx.colors), rot: rand(0, 6), vr: rand(-6, 6), vt: rand(3, 8) });
      }
    } else if (fx.mode === 'leaves') {
      if (r < 0.45) {
        addPart({ type: 'glyph', glyph: pick(fx.glyphs), x: rand(0, W), y: -20, vx: rand(-30, 30), vy: rand(70, 150),
          size: rand(18, 30), life: 7, sway: 50, swayF: rand(1, 2.5), rot: rand(0, 6), vr: rand(-2, 2) });
      } else if (r < 0.8) {
        addPart({ type: 'rect', x: rand(0, W), y: -20, vx: rand(-60, 60), vy: rand(140, 280), g: 140,
          size: rand(7, 12), life: 6, color: pick(fx.colors), rot: rand(0, 6), vr: rand(-6, 6), vt: rand(3, 8) });
      } else {
        addPart({ type: 'spark', x: rand(0, W), y: rand(0, H * 0.8), vy: rand(-20, 10), size: rand(4, 9),
          life: rand(1, 1.8), color: pick(['#ffd24a', '#fff3c4']) });
      }
    } else { // sparkle (HP)
      if (r < 0.5) {
        addPart({ type: 'rect', x: rand(0, W), y: -20, vx: rand(-60, 60), vy: rand(140, 280), g: 140,
          size: rand(7, 12), life: 6, color: pick(fx.colors), rot: rand(0, 6), vr: rand(-6, 6), vt: rand(3, 8) });
      } else if (r < 0.75) {
        addPart({ type: 'glyph', glyph: pick(fx.glyphs), x: rand(0, W), y: -20, vx: rand(-30, 30), vy: rand(80, 170),
          size: rand(16, 28), life: 6, sway: 30, swayF: rand(1, 3), rot: rand(-.5, .5), vr: rand(-1.5, 1.5) });
      } else {
        addPart({ type: 'spark', x: rand(0, W), y: rand(0, H * 0.9), size: rand(5, 12),
          life: rand(0.8, 1.6), color: pick(['#ffd84a', '#fff4b0', '#ffffff', '#b18cff']) });
      }
    }
  }

  function cannon(x, y, angleDeg) {
    const fx = THEMES[state.theme].fx;
    for (let i = 0; i < 55; i++) {
      const a = (angleDeg + rand(-28, 28)) * Math.PI / 180;
      const sp = rand(450, 950);
      addPart({ type: 'rect', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 900, drag: 0.985,
        size: rand(7, 13), life: rand(2.2, 3.4), color: pick(fx.colors), rot: rand(0, 6), vr: rand(-10, 10), vt: rand(4, 10) });
    }
  }

  function burst(x, y) {
    if (reduceMotion) return;
    const fx = THEMES[state.theme].fx;
    for (let i = 0; i < 16; i++) {
      const a = rand(0, 6.283), sp = rand(100, 340);
      addPart({ type: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 220, drag: 0.96,
        size: rand(3, 8), life: rand(0.55, 1.1), color: pick(fx.colors) });
    }
    for (let i = 0; i < 3; i++) {
      addPart({ type: 'glyph', glyph: pick(fx.glyphs), x: x + rand(-14, 14), y, vx: rand(-40, 40), vy: rand(-170, -90), g: 60,
        size: rand(16, 24), life: 1.2, rot: rand(-.4, .4), vr: rand(-1, 1) });
    }
    kick();
  }

  function celebrate() {
    if (reduceMotion) return;
    const W = window.innerWidth, H = window.innerHeight;
    cannon(W * 0.08, H * 0.92, -62);
    cannon(W * 0.92, H * 0.92, -118);
    emitUntil = performance.now() + 5500;
    emitAcc = 0;
    kick();
  }

  function kick() {
    if (!raf) { lastTs = performance.now(); raf = requestAnimationFrame(loop); }
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    const W = window.innerWidth, H = window.innerHeight;
    cx.clearRect(0, 0, W, H);

    if (ts < emitUntil) {
      emitAcc += dt * 60;
      while (emitAcc >= 1) { emitAcc -= 1; emitOne(); }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life || p.y > H + 80 || p.y < -120) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt;
      const d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= (p.g > 0 ? d : 1);
      p.x += p.vx * dt + (p.sway ? Math.sin(p.age * p.swayF + p.ph) * p.sway * dt : 0);
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.tilt += p.vt * dt;

      const fadeStart = p.life * 0.65;
      const alpha = p.age > fadeStart ? 1 - (p.age - fadeStart) / (p.life - fadeStart) : 1;
      cx.save();
      cx.globalAlpha = Math.max(0, alpha);
      if (p.type === 'rect') {
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.scale(1, Math.cos(p.tilt));
        cx.fillStyle = p.color;
        cx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.66);
      } else if (p.type === 'glyph') {
        cx.translate(p.x, p.y);
        cx.rotate(p.rot);
        cx.font = p.size + 'px serif';
        cx.textAlign = 'center';
        cx.textBaseline = 'middle';
        cx.fillText(p.glyph, 0, 0);
      } else if (p.type === 'dot') {
        cx.fillStyle = p.color;
        cx.beginPath();
        cx.arc(p.x, p.y, p.size, 0, 6.283);
        cx.fill();
      } else { // spark with glow
        cx.globalCompositeOperation = 'lighter';
        const tw = p.g === 0 && p.vx === 0 ? 0.5 + 0.5 * Math.sin(p.age * 12) : 1;
        const r = p.size * (0.6 + 0.4 * tw);
        const grad = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.2);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        cx.fillStyle = grad;
        cx.beginPath();
        cx.arc(p.x, p.y, r * 2.2, 0, 6.283);
        cx.fill();
      }
      cx.restore();
    }

    if (parts.length || ts < emitUntil) {
      raf = requestAnimationFrame(loop);
    } else {
      raf = null;
      cx.clearRect(0, 0, W, H);
    }
  }

  function clearFx() {
    parts = [];
    emitUntil = 0;
    cx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }

  /* ================= THEME / SCREENS ================= */
  function applyTheme(key) {
    state.theme = key;
    const t = THEMES[key];
    document.body.dataset.theme = key;
    $('setupTitle').textContent = t.title;
    $('setupSub').textContent = t.sub;
    $('gameTitle').textContent = t.title;
    renderChoices();
  }

  function renderChoices() {
    const tc = $('themeChoices');
    tc.innerHTML = '';
    Object.keys(THEMES).forEach(key => {
      const t = THEMES[key];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.setAttribute('aria-pressed', String(state.theme === key));
      b.innerHTML = '<span class="c-icon"></span><span class="c-name"></span>';
      b.querySelector('.c-icon').textContent = t.icon;
      b.querySelector('.c-name').textContent = t.label;
      b.addEventListener('click', () => applyTheme(key));
      tc.appendChild(b);
    });
    const dc = $('diffChoices');
    dc.innerHTML = '';
    Object.keys(LEVELS).forEach(key => {
      const l = LEVELS[key];
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'choice';
      b.setAttribute('aria-pressed', String(state.level === key));
      b.innerHTML = '<span class="c-name"></span><span class="c-desc"></span>';
      b.querySelector('.c-name').textContent = l.label;
      b.querySelector('.c-desc').textContent = l.desc;
      b.addEventListener('click', () => { state.level = key; renderChoices(); });
      dc.appendChild(b);
    });
  }

  function showScreen(which) {
    $('setup').classList.toggle('hidden', which !== 'setup');
    $('game').classList.toggle('hidden', which !== 'game');
    if (which === 'game') requestAnimationFrame(layoutBoard);
    window.scrollTo(0, 0);
  }

  /* ================= GAME ================= */
  function updateStats() {
    $('moves').textContent = moves;
    $('score').textContent = score;
    $('time').textContent = fmtTime(elapsed);
    $('playerLabel').textContent = state.name || '\u2014';
  }
  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }
  function startTimer() {
    startTime = Date.now();
    timerId = setInterval(() => {
      elapsed = Math.floor((Date.now() - startTime) / 1000);
      $('time').textContent = fmtTime(elapsed);
    }, 250);
  }
  function stopTimer() { clearInterval(timerId); timerId = null; }

  function layoutBoard() {
    const n = LEVELS[state.level].n;
    const gap = n >= 8 ? 4 : n >= 6 ? 6 : 10;
    const wrap = $('boardWrap');
    const avail = wrap.clientWidth - 24;
    if (avail <= 0) return;
    const maxH = Math.max(360, window.innerHeight - 290);
    const side = Math.min(avail, 700, maxH);
    const cell = (side - gap * (n - 1)) / n;
    board.style.width = side + 'px';
    board.style.setProperty('--cols', n);
    board.style.setProperty('--gap', gap + 'px');
    board.style.setProperty('--cell', cell + 'px');
    board.classList.toggle('names-hidden', cell < 76);
  }

  function buildBoard() {
    const t = THEMES[state.theme];
    const n = LEVELS[state.level].n;
    totalPairs = (n * n) / 2;
    const chosen = shuffle(t.chars.slice()).slice(0, totalPairs);
    const deck = shuffle(chosen.concat(chosen));
    board.innerHTML = '';
    const stagger = n >= 8 ? 10 : n >= 6 ? 18 : 30;
    deck.forEach((ch, i) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'card';
      card.style.animationDelay = (i * stagger) + 'ms';
      card.dataset.name = ch[0];
      card.setAttribute('aria-label', 'Hidden card');
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="face back"><div class="back-symbol"></div></div>' +
          '<div class="face front"><span class="char-icon"></span><span class="char-name"></span></div>' +
        '</div>';
      const sym = card.querySelector('.back-symbol');
      if (t.backSymbol) sym.textContent = t.backSymbol; else sym.classList.add('ring');
      card.querySelector('.char-icon').textContent = ch[1];
      card.querySelector('.char-name').textContent = ch[0];
      card.addEventListener('click', () => flip(card));
      board.appendChild(card);
    });
    layoutBoard();
  }

  function startGame() {
    stopTimer();
    clearFx();
    document.body.classList.remove('won');
    $('winOverlay').classList.remove('show');
    first = null; second = null; lock = false;
    moves = 0; score = 0; streak = 0; matches = 0; elapsed = 0;
    playing = true;
    $('gameTitle').textContent = THEMES[state.theme].title;
    $('gameSub').textContent = state.name + ' \u00B7 ' + LEVELS[state.level].label + ' ' + LEVELS[state.level].n + '\u00D7' + LEVELS[state.level].n;
    updateStats();
    buildBoard();
  }

  function flip(card) {
    if (!playing || lock) return;
    if (card === first) return;
    if (card.classList.contains('matched')) return;

    if (!timerId && moves === 0 && !first) startTimer();
    card.classList.add('flipped');
    card.setAttribute('aria-label', card.dataset.name);

    if (!first) { first = card; return; }

    second = card;
    moves++;
    bump($('moves'));
    lock = true;

    if (first.dataset.name === second.dataset.name) {
      const a = first, b = second;
      a.classList.add('matched');
      b.classList.add('matched');
      streak++;
      score += MATCH_POINTS + STREAK_BONUS * (streak - 1);
      matches++;
      bump($('score'));
      updateStats();
      playMatch();
      setTimeout(() => {
        [a, b].forEach(c => {
          const r = c.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2);
        });
      }, 350);
      first = null; second = null; lock = false;
      if (matches === totalPairs) win();
    } else {
      streak = 0;
      score = Math.max(0, score - MISS_PENALTY);
      updateStats();
      const a = first, b = second;
      a.classList.add('wrong');
      b.classList.add('wrong');
      setTimeout(playMiss, 450);
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        a.setAttribute('aria-label', 'Hidden card');
        b.setAttribute('aria-label', 'Hidden card');
        first = null; second = null; lock = false;
      }, 1100);
    }
  }

  /* ================= RATING + HIGH SCORES ================= */
  function starsFor(value, thresholds) {
    for (let i = 0; i < thresholds.length; i++) if (value <= thresholds[i]) return 5 - i;
    return 1;
  }
  function calcStars() {
    const r = RATING[state.level];
    const ms = starsFor(moves, r.moves);
    const ts = starsFor(elapsed, r.time);
    return Math.max(1, Math.round((ms + ts) / 2));
  }

  function loadScores() {
    let data = null;
    try { data = JSON.parse(store.get('realms_highscores') || 'null'); } catch (e) {}
    data = data && typeof data === 'object' ? data : {};
    Object.keys(LEVELS).forEach(k => {
      data[k] = data[k] || {};
      data[k].time = Array.isArray(data[k].time) ? data[k].time : [];
      data[k].moves = Array.isArray(data[k].moves) ? data[k].moves : [];
    });
    return data;
  }
  function saveScores(data) { store.set('realms_highscores', JSON.stringify(data)); }

  function insertScore(list, entry, cmp) {
    list.push(entry);
    list.sort(cmp);
    const idx = list.indexOf(entry);
    if (idx >= TOP_N) { list.splice(idx, 1); return -1; }
    if (list.length > TOP_N) list.length = TOP_N;
    return idx + 1;
  }

  function recordScore() {
    const data = loadScores();
    const entry = { name: state.name, time: elapsed, moves: moves, theme: state.theme };
    const lv = data[state.level];
    const rankTime = insertScore(lv.time, entry, (a, b) => a.time - b.time || a.moves - b.moves);
    const rankMoves = insertScore(lv.moves, Object.assign({}, entry), (a, b) => a.moves - b.moves || a.time - b.time);
    saveScores(data);
    return { rankTime, rankMoves };
  }

  function renderScores() {
    const data = loadScores();
    const tabs = $('scoreTabs');
    tabs.innerHTML = '';
    Object.keys(LEVELS).forEach(k => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tab';
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', String(scoreTab === k));
      b.textContent = LEVELS[k].label;
      b.addEventListener('click', () => { scoreTab = k; renderScores(); });
      tabs.appendChild(b);
    });
    fillList($('listTime'), data[scoreTab].time, e => fmtTime(e.time), e => e.moves + ' moves');
    fillList($('listMoves'), data[scoreTab].moves, e => e.moves + ' moves', e => fmtTime(e.time));
  }
  function fillList(ol, list, main, sub) {
    ol.innerHTML = '';
    if (!list.length) {
      const li = document.createElement('li');
      li.style.display = 'block';
      li.className = 'hs-empty';
      li.textContent = 'No scores yet. Be the first!';
      ol.appendChild(li);
      return;
    }
    list.forEach((e, i) => {
      const li = document.createElement('li');
      const rank = document.createElement('span'); rank.className = 'hs-rank'; rank.textContent = i + 1;
      const name = document.createElement('span'); name.className = 'hs-name'; name.textContent = e.name;
      const val = document.createElement('span'); val.className = 'hs-val';
      val.textContent = main(e);
      const small = document.createElement('small'); small.textContent = sub(e);
      val.appendChild(small);
      li.append(rank, name, val);
      ol.appendChild(li);
    });
  }
  function openScores(level) {
    scoreTab = level || state.level;
    renderScores();
    $('scoresOverlay').classList.add('show');
  }
  function closeScores() { $('scoresOverlay').classList.remove('show'); }

  /* ================= WIN ================= */
  function win() {
    stopTimer();
    elapsed = Math.floor((Date.now() - startTime) / 1000);
    playing = false;
    updateStats();
    const stars = calcStars();
    const ranks = recordScore();

    setTimeout(() => {
      document.body.classList.add('won');
      const t = THEMES[state.theme];
      $('winText').innerHTML = '';
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = 'Well done, ' + state.name + '!';
      $('winText').append(who, document.createElement('br'), document.createTextNode(t.tagline));

      const starsEl = $('winStars');
      starsEl.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const s = document.createElement('span');
        s.className = 'star' + (i <= stars ? ' on' : '');
        s.textContent = '\u2605';
        if (i <= stars) s.style.animationDelay = (0.3 + i * 0.18) + 's';
        starsEl.appendChild(s);
      }
      starsEl.setAttribute('aria-label', stars + ' out of 5 stars');
      $('ratingLabel').textContent = RATING_LABELS[stars];
      $('winTime').textContent = fmtTime(elapsed);
      $('winMoves').textContent = moves;
      $('winScore').textContent = score;

      const notes = $('winNotes');
      notes.innerHTML = '';
      const lvl = LEVELS[state.level].label;
      const addNote = (txt, plain) => {
        const d = document.createElement('div');
        d.className = 'note' + (plain ? ' plain' : '');
        d.textContent = txt;
        notes.appendChild(d);
      };
      if (ranks.rankTime > 0) addNote('\uD83C\uDFC6 New high score! Fastest time #' + ranks.rankTime + ' on ' + lvl);
      if (ranks.rankMoves > 0) addNote('\uD83C\uDFC6 New high score! Fewest moves #' + ranks.rankMoves + ' on ' + lvl);
      if (ranks.rankTime < 0 && ranks.rankMoves < 0) addNote('No high score this time. Try again to beat the top ' + TOP_N + '!', true);

      $('winOverlay').classList.add('show');
      playWin();
      celebrate();
    }, 800);
  }

  /* ================= FLOW ================= */
  function confirmStart() {
    const value = $('nameInput').value.trim();
    if (!value) {
      $('nameError').textContent = 'Please enter your name to play.';
      $('nameInput').focus();
      return;
    }
    $('nameError').textContent = '';
    state.name = value;
    getCtx(); // unlock audio on a user gesture
    showScreen('game');
    startGame();
  }

  function toMenu() {
    stopTimer();
    clearFx();
    playing = false;
    document.body.classList.remove('won');
    $('winOverlay').classList.remove('show');
    showScreen('setup');
    renderChoices();
  }

  function resetAll() {
    stopTimer();
    clearFx();
    playing = false;
    first = null; second = null; lock = false;
    moves = 0; score = 0; streak = 0; matches = 0; elapsed = 0;
    state.name = '';
    state.level = 'easy';
    $('nameInput').value = '';
    $('nameError').textContent = '';
    board.innerHTML = '';
    document.body.classList.remove('won');
    $('winOverlay').classList.remove('show');
    applyTheme('hp');
    updateStats();
    showScreen('setup');
    setTimeout(() => $('nameInput').focus(), 100);
  }

  /* ================= EVENTS ================= */
  $('startBtn').addEventListener('click', confirmStart);
  $('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') confirmStart(); });
  $('restartBtn').addEventListener('click', () => { if (state.name) startGame(); });
  $('menuBtn').addEventListener('click', toMenu);
  $('resetBtn').addEventListener('click', resetAll);
  $('againBtn').addEventListener('click', startGame);
  $('winMenuBtn').addEventListener('click', toMenu);
  $('winScoresBtn').addEventListener('click', () => openScores(state.level));
  $('scoresBtn').addEventListener('click', () => openScores(state.level));
  $('closeScores').addEventListener('click', closeScores);
  $('scoresOverlay').addEventListener('click', e => { if (e.target === $('scoresOverlay')) closeScores(); });
  $('soundBtn').addEventListener('click', () => {
    muted = !muted;
    store.set('realms_muted', muted ? '1' : '0');
    updateSoundBtn();
    if (!muted) { getCtx(); tone(660, 0, 0.15, 'sine', 0.12); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeScores(); });
  window.addEventListener('resize', () => { resizeCanvas(); if (!$('game').classList.contains('hidden')) layoutBoard(); });

  /* ================= INIT ================= */
  resizeCanvas();
  updateSoundBtn();
  applyTheme('hp');
  updateStats();
  setTimeout(() => $('nameInput').focus(), 100);
})();
</script>
</body>
</html>
